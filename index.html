<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>سكينة — شاشة البيت</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;600&family=Amiri&display=swap" rel="stylesheet">
<style>
  /* Written for the LG webOS 5 browser (Chromium 68): no flex gap, no inset, no blur filters, no ?. or ??. */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: #0d1230; }
  body { font-family: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, Arial, sans-serif; color: #fff; }

  .bg { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background-size: cover; background-position: center;
        opacity: 0; transition: opacity 2.5s ease; }
  .bg.on { opacity: 1; }
  /* Fallback until a photo loads: a calm desert-dusk gradient, nothing drawn behind the clock */
  #bg0 { opacity: 1; background-image: linear-gradient(165deg, #0c1131 0%, #1d1c4a 42%, #4a3260 72%, #8d5a57 100%); }
  .shade { position: fixed; top: 0; left: 0; right: 0; bottom: 0;
           background: linear-gradient(180deg, rgba(0,0,0,.5) 0%, rgba(0,0,0,.15) 30%, rgba(0,0,0,.15) 55%, rgba(0,0,0,.7) 100%); }

  .num { direction: ltr; unicode-bidi: isolate; display: inline-block; }
  .card { background: rgba(8,10,28,.55); border: 1px solid rgba(255,255,255,.14); border-radius: 1.2vw; }
  .muted { opacity: .72; }
  .lbl { font-size: 1.05vw; opacity: .72; }
  .fade { transition: opacity .8s ease; }

  /* One grid for the whole screen. In RTL the first column is on the right. */
  .wrap { position: fixed; top: 0; left: 0; right: 0; bottom: 0; padding: 5vh 4.5vw 2.6vh;
          display: grid; grid-template-columns: 1fr 29vw; grid-template-rows: auto 1fr auto auto;
          grid-column-gap: 2.4vw; grid-row-gap: 3.2vh; }

  /* Row 1, right: clock and dates */
  #clockBox { grid-column: 1; grid-row: 1; align-self: start; }
  .brand { font-size: 1.15vw; font-weight: 600; opacity: .85; margin-bottom: .6vh; }
  #clock { font-size: 9vw; font-weight: 300; line-height: 1; text-shadow: 0 .3vw 2vw rgba(0,0,0,.35); }
  #clock .sec { font-size: 2.4vw; opacity: .6; margin-left: .5vw; }
  .dates { margin-top: 1.2vh; font-size: 1.5vw; line-height: 1.6; text-shadow: 0 .1vw .8vw rgba(0,0,0,.5); }

  /* Row 1, left: weather */
  #wx { grid-column: 2; grid-row: 1; align-self: start; }
  #wxHead { display: flex; align-items: center; justify-content: space-between; }
  #wxNow { display: flex; align-items: center; font-size: 2.6vw; font-weight: 300; }
  #wxNow svg { width: 3vw; height: 3vw; margin-left: .8vw; }
  #wxCity { font-size: 1.15vw; text-align: left; }
  #wxDays { display: grid; grid-template-columns: repeat(5, 1fr); grid-gap: .6vw; margin-top: 1.6vh; }
  .day { text-align: center; padding: 1vh 0; font-size: 1vw; }
  .day svg { width: 1.9vw; height: 1.9vw; display: block; margin: .5vh auto; }
  .day .hi { font-weight: 600; font-size: 1.15vw; }

  /* Row 2, right: verse / hadith — same height as the left column */
  #wisdom { grid-column: 1; grid-row: 2; padding: 3vh 2.6vw; display: flex; flex-direction: column; justify-content: center; }
  #wText { font-family: "Amiri", "Noto Naskh Arabic", serif; font-size: 2.1vw; line-height: 1.8; margin-top: 1vh; }
  #wText.small { font-size: 1.65vw; }
  #wSrc { font-size: 1.05vw; opacity: .7; margin-top: 1.4vh; }

  /* Row 2, left: next prayer, then the match */
  #side { grid-column: 2; grid-row: 2; display: flex; flex-direction: column; }
  #nextCard { flex: 1; padding: 2.4vh 2vw; display: flex; flex-direction: column; justify-content: center; }
  #nextName { font-size: 3vw; font-weight: 600; margin: .3vh 0; }
  #nextAt { font-size: 1.25vw; opacity: .85; }
  #count { font-size: 2.5vw; font-weight: 300; margin-top: .8vh; color: #ffdcae; text-align: right; }
  #iqama { font-size: 1.05vw; margin-top: .4vh; color: #ffdcae; }
  #iqama:empty { display: none; }
  #matchCard { margin-top: 1.6vh; padding: 1.6vh 2vw; display: none; }
  .teams { font-size: 1.5vw; font-weight: 600; margin: .4vh 0 .2vh; }
  .teams .vs { opacity: .6; font-weight: 400; margin: 0 .6vw; }
  #matchWhen { font-size: 1.1vw; opacity: .85; }
  #matchLast { font-size: 1vw; opacity: .7; margin-top: .5vh; }
  #matchLast:empty { display: none; }

  /* Row 3: the six prayers */
  #prayers { grid-column: 1 / 3; grid-row: 3; display: grid; grid-template-columns: repeat(6, 1fr); grid-gap: 1vw; }
  .p { text-align: center; padding: 1.8vh 0; }
  .p .n { font-size: 1.25vw; opacity: .78; }
  .p .t { font-size: 2.3vw; font-weight: 600; margin-top: .4vh; }
  .p.on { background: rgba(255,220,174,.2); border-color: rgba(255,220,174,.7); }
  .p.on .n { opacity: 1; color: #ffdcae; }
  .p.done { opacity: .55; }

  /* Row 4: footer */
  #foot { grid-column: 1 / 3; grid-row: 4; display: flex; justify-content: space-between; align-items: center; }
  #ayahLine { font-size: .95vw; opacity: .6; }
  #credit { font-size: .85vw; opacity: .55; direction: ltr; }

  /* Diagnostics overlay (#debug in the address) */
  #dbg { position: fixed; top: 2vh; left: 2vw; width: 46vw; max-height: 60vh; overflow: hidden; z-index: 9;
         background: rgba(0,0,0,.85); color: #9ef59e; font: 1vw/1.45 Consolas, monospace; padding: 1vh 1vw;
         direction: ltr; text-align: left; border-radius: .6vw; white-space: pre-wrap; display: none; }
</style>
</head>
<body>
<div class="bg" id="bg0"></div>
<div class="bg" id="bgA"></div>
<div class="bg" id="bgB"></div>
<div class="shade"></div>

<div class="wrap">
  <div id="clockBox">
    <div class="brand">✦ سكينة</div>
    <div id="clock">--:--</div>
    <div class="dates"><div id="hijri"></div><div id="greg" class="muted"></div></div>
  </div>

  <div id="wx">
    <div id="wxHead"><div id="wxNow"></div><div id="wxCity" class="muted"></div></div>
    <div id="wxDays"></div>
  </div>

  <div id="wisdom" class="card fade" style="opacity:0">
    <div class="lbl" id="wLbl"></div>
    <div id="wText"></div>
    <div id="wSrc"></div>
  </div>

  <div id="side">
    <div id="nextCard" class="card">
      <div class="lbl">الصلاة القادمة</div>
      <div id="nextName">—</div>
      <div id="nextAt"></div>
      <div id="count" class="num"></div>
      <div id="iqama"></div>
    </div>
    <div id="matchCard" class="card">
      <div class="lbl" id="matchLbl">المباراة القادمة</div>
      <div class="teams" id="matchTeams"></div>
      <div id="matchWhen"></div>
      <div id="matchLast"></div>
    </div>
  </div>

  <div id="prayers"></div>

  <div id="foot">
    <div id="ayahLine">﴿ إِنَّ الصَّلَاةَ كَانَتْ عَلَى الْمُؤْمِنِينَ كِتَابًا مَّوْقُوتًا ﴾</div>
    <div id="credit"></div>
  </div>
</div>
<div id="dbg"></div>

<script>
(function () {
  'use strict';

  // ---------- Settings (override with #city=..&lat=..&lon=..&teams=id,id) ----------
  var CFG = { city: 'الرياض', lat: 24.7136, lon: 46.6753, tz: 3, teams: ['136137'] };
  (location.hash || '').replace(/^#/, '').split('&').forEach(function (kv) {
    var p = kv.split('='); if (!p[0] || p[1] === undefined) return;
    var v = decodeURIComponent(p[1]);
    if (p[0] === 'city') CFG.city = v;
    if (p[0] === 'lat') CFG.lat = parseFloat(v);
    if (p[0] === 'lon') CFG.lon = parseFloat(v);
    if (p[0] === 'teams') CFG.teams = v.split(',').filter(Boolean);
  });

  var $ = function (id) { return document.getElementById(id); };
  function pad(n) { return (n < 10 ? '0' : '') + n; }

  // Diagnostics: open the page with #debug to see every request and error on screen.
  var DEBUG = /(^|[#&])debug($|&)/.test(location.hash), dbgLines = [];
  function dbg(msg) {
    if (!DEBUG) return;
    var d = new Date();
    dbgLines.push(pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()) + '  ' + msg);
    if (dbgLines.length > 26) dbgLines.shift();
    var el = $('dbg'); el.style.display = 'block'; el.textContent = dbgLines.join('\n');
  }
  window.onerror = function (m, src, line) { dbg('JS ERROR: ' + m + ' @' + line); };
  if (DEBUG) dbg('UA: ' + navigator.userAgent);
  function store(k, v) { try { localStorage.setItem('sk_' + k, JSON.stringify({ t: Date.now(), v: v })); } catch (e) {} }
  function load(k, maxAgeMs) {
    try { var o = JSON.parse(localStorage.getItem('sk_' + k)); if (o && (!maxAgeMs || Date.now() - o.t < maxAgeMs)) return o.v; } catch (e) {}
    return null;
  }
  // XMLHttpRequest rather than fetch: the first version used it and the weather loaded on this TV.
  function getJSON(url) {
    var host = url.split('/')[2];
    return new Promise(function (resolve, reject) {
      var x = new XMLHttpRequest();
      x.open('GET', url); x.timeout = 20000;
      x.onload = function () {
        if (x.status < 200 || x.status >= 300) { dbg('FAIL ' + host + ' HTTP ' + x.status); return reject(new Error(x.status)); }
        try { var j = JSON.parse(x.responseText); dbg('OK   ' + host + ' (' + x.responseText.length + ' bytes)'); resolve(j); }
        catch (e) { dbg('FAIL ' + host + ' bad JSON'); reject(e); }
      };
      x.onerror = function () { dbg('FAIL ' + host + ' network/CORS/TLS error'); reject(new Error('network')); };
      x.ontimeout = function () { dbg('FAIL ' + host + ' timeout'); reject(new Error('timeout')); };
      x.send();
    });
  }
  function dayIndex(d) { return Math.floor((Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())) / 864e5); }
  var HOUR = 36e5;

  // ---------- Prayer times (PrayTimes.org algorithm, Umm al-Qura) ----------
  var NAMES = { fajr: 'الفجر', sunrise: 'الشروق', dhuhr: 'الظهر', asr: 'العصر', maghrib: 'المغرب', isha: 'العشاء' };
  var ORDER = ['fajr', 'sunrise', 'dhuhr', 'asr', 'maghrib', 'isha'];
  var IQAMA = { fajr: 25, dhuhr: 20, asr: 20, maghrib: 10, isha: 20 };
  var rad = Math.PI / 180;
  function fix(a, b) { a = a - b * Math.floor(a / b); return a < 0 ? a + b : a; }
  function julian(y, m, d) {
    if (m <= 2) { y -= 1; m += 12; }
    var A = Math.floor(y / 100), B = 2 - A + Math.floor(A / 4);
    return Math.floor(365.25 * (y + 4716)) + Math.floor(30.6001 * (m + 1)) + d + B - 1524.5;
  }
  function sun(jd) {
    var D = jd - 2451545.0, g = fix(357.529 + 0.98560028 * D, 360), q = fix(280.459 + 0.98564736 * D, 360);
    var L = fix(q + 1.915 * Math.sin(g * rad) + 0.020 * Math.sin(2 * g * rad), 360), e = 23.439 - 0.00000036 * D;
    var RA = Math.atan2(Math.cos(e * rad) * Math.sin(L * rad), Math.cos(L * rad)) / rad / 15;
    return { decl: Math.asin(Math.sin(e * rad) * Math.sin(L * rad)) / rad, eqt: q / 15 - fix(RA, 24) };
  }
  function prayerTimes(date, ramadan) {
    var LAT = CFG.lat, LNG = CFG.lon;
    var jd = julian(date.getFullYear(), date.getMonth() + 1, date.getDate()) - LNG / 360;
    function noon(t) { return fix(12 - sun(jd + t / 24).eqt, 24); }
    function angle(a, t, ccw) {
      var d = sun(jd + t / 24).decl;
      var x = Math.acos((-Math.sin(a * rad) - Math.sin(d * rad) * Math.sin(LAT * rad)) / (Math.cos(d * rad) * Math.cos(LAT * rad))) / rad / 15;
      return noon(t) + (ccw ? -x : x);
    }
    function asrAngle(t) { var d = sun(jd + t / 24).decl; return -Math.atan(1 / (1 + Math.tan(Math.abs(LAT - d) * rad))) / rad; }
    var t = { fajr: 5, sunrise: 6, dhuhr: 12, asr: 13, maghrib: 18 };
    for (var k = 0; k < 2; k++) {
      t = { fajr: angle(18.5, t.fajr, true), sunrise: angle(0.833, t.sunrise, true), dhuhr: noon(t.dhuhr),
            asr: angle(asrAngle(t.asr), t.asr, false), maghrib: angle(0.833, t.maghrib, false) };
    }
    var adj = CFG.tz - LNG / 15, out = {}, res = {};
    for (var n in t) out[n] = t[n] + adj;
    out.isha = out.maghrib + (ramadan ? 120 : 90) / 60;
    ORDER.forEach(function (n) {
      res[n] = new Date(date.getFullYear(), date.getMonth(), date.getDate(), 0, Math.ceil(out[n] * 60 - 0.0001), 0);
    });
    return res;
  }

  // ---------- Dates ----------
  var hijriFmt = null, gregFmt = null, dayFmt = null;
  try { hijriFmt = new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura-nu-latn', { day: 'numeric', month: 'long', year: 'numeric' }); } catch (e) {}
  try { gregFmt = new Intl.DateTimeFormat('ar-EG-u-nu-latn', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }); } catch (e) {}
  var DAYS = ['الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
  function isRamadan(d) {
    try { return parseInt(new Intl.DateTimeFormat('en-u-ca-islamic-umalqura', { month: 'numeric' }).format(d), 10) === 9; } catch (e) { return false; }
  }
  function hm12(d) {
    var h = d.getHours(), ap = h < 12 ? 'ص' : 'م'; h = h % 12; if (h === 0) h = 12;
    return '<span class="num">' + h + ':' + pad(d.getMinutes()) + '</span> ' + ap;
  }

  // ---------- Clock and prayers ----------
  var dayKey = '', today, tomorrow, cells = {};
  function buildDay(now) {
    var tmr = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
    today = prayerTimes(now, isRamadan(now)); tomorrow = prayerTimes(tmr, isRamadan(tmr));
    var row = $('prayers'); row.innerHTML = '';
    ORDER.forEach(function (n) {
      var c = document.createElement('div'); c.className = 'p card';
      var label = (n === 'maghrib' && isRamadan(now)) ? 'المغرب · الإفطار' : NAMES[n];
      c.innerHTML = '<div class="n">' + label + '</div><div class="t">' + hm12(today[n]) + '</div>';
      row.appendChild(c); cells[n] = c;
    });
    $('hijri').textContent = hijriFmt ? hijriFmt.format(now) : '';
    $('greg').textContent = gregFmt ? gregFmt.format(now) : now.toDateString();
  }
  function tick() {
    var now = new Date(), key = now.toDateString();
    if (key !== dayKey) { dayKey = key; buildDay(now); }
    var h = now.getHours() % 12; if (h === 0) h = 12;
    $('clock').innerHTML = '<span class="num">' + h + ':' + pad(now.getMinutes()) + '<span class="sec">' + pad(now.getSeconds()) + '</span></span>';

    var next = null, nextName = '', isTmr = false, i, n;
    for (i = 0; i < ORDER.length; i++) { n = ORDER[i]; if (n !== 'sunrise' && today[n] > now) { next = today[n]; nextName = n; break; } }
    if (!next) { next = tomorrow.fajr; nextName = 'fajr'; isTmr = true; }

    // Iqama countdown: within the window after the most recent adhan
    var iq = '';
    for (i = ORDER.length - 1; i >= 0; i--) {
      n = ORDER[i]; if (n === 'sunrise' || today[n] > now) continue;
      var iqAt = new Date(today[n].getTime() + IQAMA[n] * 6e4);
      if (iqAt > now) { var s = Math.floor((iqAt - now) / 1000); iq = 'إقامة ' + NAMES[n] + ' بعد <span class="num">' + pad(Math.floor(s / 60)) + ':' + pad(s % 60) + '</span>'; }
      break;
    }
    $('iqama').innerHTML = iq;

    ORDER.forEach(function (k) {
      cells[k].className = 'p card' + (k === nextName && !isTmr ? ' on' : (today[k] <= now ? ' done' : ''));
    });
    var diff = Math.max(0, Math.floor((next - now) / 1000));
    $('nextName').textContent = NAMES[nextName] + (isTmr ? ' غدًا' : '');
    $('nextAt').innerHTML = 'الأذان ' + hm12(next);
    $('count').textContent = pad(Math.floor(diff / 3600)) + ':' + pad(Math.floor(diff / 60) % 60) + ':' + pad(diff % 60);

    // Daily reload at 3:30 AM: picks up page updates and frees any memory the browser held on to.
    if (now.getHours() === 3 && now.getMinutes() === 30 && now.getSeconds() === 0) location.reload();
  }

  // ---------- Background photos (Unsplash, hotlinked; rotate every 30 min) ----------
  var PHOTOS = [["photo-1682685797365-41f45b562c0a","NEOM"],["photo-1682687220566-5599dbbebf11","NEOM"],["photo-1682687218608-5e2522b04673","NEOM"],["photo-1682685796063-d2604827f7b3","NEOM"],["photo-1682687220208-22d7a2543e88","NEOM"],["photo-1682687220499-d9c06b872eee","NEOM"],["photo-1682687221175-fd40bbafe6ca","NEOM"],["photo-1682685797736-dabb341dc7de","NEOM"],["photo-1506795213373-430e921fe2ed","Hala AlGhanim"],["photo-1682687981974-c5ef2111640c","NEOM"],["photo-1682687218147-9806132dc697","NEOM"],["photo-1682686581362-796145f0e123","NEOM"],["photo-1682686581427-7c80ab60e3f3","NEOM"],["photo-1682685796766-0fddd3e480de","NEOM"],["photo-1682686580186-b55d2a91053c","NEOM"],["photo-1682687220067-dced9a881b56","NEOM"],["photo-1682687221073-53ad74c2cad7","NEOM"],["photo-1707343843598-39755549ac9a","NEOM"]];
  var front = 'bgA';
  function photoUrl(p) { return 'https://images.unsplash.com/' + p[0] + '?ixlib=rb-4.1.0&w=1920&h=1080&fit=crop&q=72&fm=jpg'; }
  function showPhoto() {
    var slot = Math.floor(Date.now() / (30 * 6e4));
    var p = PHOTOS[slot % PHOTOS.length], url = photoUrl(p), img = new Image();
    img.onload = function () {
      var back = front === 'bgA' ? 'bgB' : 'bgA';
      $(back).style.backgroundImage = 'url("' + url + '")';
      $(back).className = 'bg on'; $(front).className = 'bg';
      setTimeout(function () { $(front).style.backgroundImage = ''; front = back; }, 3000); // release the old image
      $('credit').textContent = 'Photo: ' + p[1] + ' · Unsplash';
      dbg('OK   photo ' + p[0] + ' ' + img.naturalWidth + 'x' + img.naturalHeight);
    };
    img.onerror = function () { dbg('FAIL photo ' + p[0] + ' (image did not load)'); };
    dbg('...  loading photo ' + p[0]);
    img.src = url;
  }

  // ---------- Weather (Open-Meteo, every 30 min) ----------
  function icon(code) {
    var sunI = '<circle cx="12" cy="12" r="4.5" fill="#ffd36b"/><g stroke="#ffd36b" stroke-width="1.8" stroke-linecap="round"><path d="M12 2.5v2.4M12 19.1v2.4M2.5 12h2.4M19.1 12h2.4M5.3 5.3l1.7 1.7M17 17l1.7 1.7M5.3 18.7l1.7-1.7M17 7l1.7-1.7"/></g>';
    var cloud = '<path d="M7 18.5h10a4 4 0 0 0 .4-8A5.5 5.5 0 0 0 6.9 9.6 4.5 4.5 0 0 0 7 18.5z" fill="#e8ecf5"/>';
    var g;
    if (code === 0) g = sunI;
    else if (code <= 2) g = '<g transform="translate(-3,-3) scale(.75)">' + sunI + '</g>' + cloud;
    else if (code === 3) g = cloud;
    else if (code === 45 || code === 48) g = '<g stroke="#e8ecf5" stroke-width="2" stroke-linecap="round"><path d="M4 9h16M3 13h18M5 17h14"/></g>';
    else if (code >= 95) g = cloud + '<path d="M12.5 14l-2.5 4h3l-2 4" stroke="#ffd36b" stroke-width="1.8" fill="none"/>';
    else g = cloud + '<g stroke="#8cc8ff" stroke-width="1.8" stroke-linecap="round"><path d="M9 20.5l-1 2M13 20.5l-1 2M17 20.5l-1 2"/></g>';
    return '<svg viewBox="0 0 24 24">' + g + '</svg>';
  }
  var WX = { 0: 'صافٍ', 1: 'صافٍ غالبًا', 2: 'غائم جزئيًا', 3: 'غائم', 45: 'ضباب', 48: 'ضباب', 51: 'رذاذ', 53: 'رذاذ', 55: 'رذاذ',
             61: 'مطر خفيف', 63: 'مطر', 65: 'مطر غزير', 80: 'زخات', 81: 'زخات', 82: 'زخات قوية', 95: 'عواصف رعدية' };
  function renderWeather(w) {
    if (!w) return;
    $('wxNow').innerHTML = '<span>' + (WX[w.code] || '') + ' <span class="num">' + w.temp + '°</span></span>' + icon(w.code);
    $('wxCity').textContent = CFG.city;
    var html = '';
    for (var i = 1; i < w.days.length && i <= 5; i++) {
      var d = w.days[i];
      html += '<div class="day card"><div class="muted">' + DAYS[new Date(d.date + 'T12:00:00').getDay()] + '</div>' + icon(d.code) +
              '<div class="hi num">' + d.max + '°</div><div class="muted num">' + d.min + '°</div></div>';
    }
    $('wxDays').innerHTML = html;
  }
  function weather() {
    if (!$('wxCity').textContent) $('wxCity').textContent = CFG.city;   // keep the corner filled even before data arrives
    renderWeather(load('wx', 3 * HOUR));
    getJSON('https://api.open-meteo.com/v1/forecast?latitude=' + CFG.lat + '&longitude=' + CFG.lon +
            '&current_weather=true&daily=weathercode,temperature_2m_max,temperature_2m_min&forecast_days=6&timezone=auto')
      .then(function (j) {
        var w = { temp: Math.round(j.current_weather.temperature), code: j.current_weather.weathercode, days: [] };
        for (var i = 0; i < j.daily.time.length; i++)
          w.days.push({ date: j.daily.time[i], code: j.daily.weathercode[i], max: Math.round(j.daily.temperature_2m_max[i]), min: Math.round(j.daily.temperature_2m_min[i]) });
        store('wx', w); renderWeather(w);
      }).catch(function (e) { dbg('weather not shown: ' + (e && e.message)); });
  }

  // ---------- Verse of the day (text from api.alquran.cloud) and hadith of the day (an-Nawawi's Forty) ----------
  var VERSES = ['13:28', '94:5', '2:152', '2:186', '3:139', '2:153', '40:60', '29:69', '12:87', '20:114', '33:41', '9:51',
                '2:201', '25:74', '14:7', '93:5', '3:173', '11:115', '16:128', '3:200', '20:25', '65:3', '39:53', '2:45', '7:56', '21:87'];
  var wisdom = { verse: null, hadith: null }, showing = 'hadith';
  function loadVerse() {
    var now = new Date(), key = 'verse_' + now.toDateString(), cached = load(key);
    if (cached) { wisdom.verse = cached; return; }
    var ref = VERSES[dayIndex(now) % VERSES.length];
    getJSON('https://api.alquran.cloud/v1/ayah/' + ref + '/quran-uthmani').then(function (j) {
      wisdom.verse = { text: j.data.text, src: j.data.surah.name + ' · الآية ' + j.data.numberInSurah };
      store(key, wisdom.verse);
    }).catch(function () {});
  }
  // Split the trailing source, e.g. "... [رواه البخاري] ، [ومسلم]". Only hadiths whose source is a clean
  // "رواه البخاري / مسلم" line are kept, so nothing odd ever reaches the screen.
  function parseHadith(h) {
    var txt = h.text.replace(/<br\s*\/?>/gi, ' ').replace(/\s+/g, ' ').trim();
    var m = txt.match(/((?:\s*[،,.]?\s*\[[^\]]+\])+)\s*[.،]?\s*$/);
    if (!m) return null;
    var src = m[1].match(/\[[^\]]+\]/g).map(function (s) { return s.slice(1, -1).trim(); }).join(' ');
    if (src.indexOf('رَوَاهُ') !== 0 || /[0-9]/.test(src)) return null;
    return { n: h.hadithnumber, text: txt.slice(0, m.index).trim(), src: src };
  }
  function pickHadith(list) {
    var h = list[dayIndex(new Date()) % list.length];
    wisdom.hadith = { text: h.text, src: 'الأربعون النووية · الحديث ' + h.n + ' · ' + h.src };
  }
  function loadHadith() {
    var list = load('nawawi2', 7 * 24 * HOUR);
    if (list && list.length) { pickHadith(list); return; }
    getJSON('https://cdn.jsdelivr.net/gh/fawazahmed0/hadith-api@1/editions/ara-nawawi.min.json').then(function (j) {
      var clean = j.hadiths.filter(function (h) { return h.text && h.text.length <= 420; }).map(parseHadith).filter(Boolean);
      if (!clean.length) return;
      store('nawawi2', clean); pickHadith(clean);
    }).catch(function () {});
  }
  function rotateWisdom() {
    var nextKind = showing === 'verse' ? 'hadith' : 'verse';
    if (!wisdom[nextKind]) nextKind = showing;
    var w = wisdom[nextKind], box = $('wisdom');
    if (!w) { box.style.opacity = 0; return; }
    box.style.opacity = 0;
    setTimeout(function () {
      $('wLbl').textContent = nextKind === 'verse' ? 'آية اليوم' : 'حديث اليوم';
      $('wText').textContent = nextKind === 'verse' ? '﴿ ' + w.text + ' ﴾' : w.text;
      $('wText').className = w.text.length > 220 ? 'small' : '';
      $('wSrc').textContent = w.src;
      box.style.opacity = 1; showing = nextKind;
    }, 900);
  }

  // ---------- Matches (TheSportsDB free key, refreshed every 3 h, cached) ----------
  var AR = { 'Saudi Arabia': 'السعودية', 'Al-Hilal': 'الهلال', 'Al-Nassr': 'النصر', 'Al-Ittihad': 'الاتحاد', 'Al-Ahli': 'الأهلي',
    'Al-Shabab': 'الشباب', 'Al-Taawoun': 'التعاون', 'Al-Ettifaq': 'الاتفاق', 'Al-Fateh': 'الفتح', 'Al-Riyadh': 'الرياض', 'Damac': 'ضمك',
    'Al-Khaleej': 'الخليج', 'Al-Fayha': 'الفيحاء', 'Al-Okhdood': 'الأخدود', 'Al-Qadsiah': 'القادسية', 'Al-Kholood': 'الخلود', 'Neom': 'نيوم',
    'Al-Najma': 'النجمة', 'Al-Hazem': 'الحزم', 'Al-Wehda': 'الوحدة', 'Al-Raed': 'الرائد', 'Al-Faisaly': 'الفيصلي', 'Abha': 'أبها',
    'Uruguay': 'الأوروغواي', 'Spain': 'إسبانيا', 'Argentina': 'الأرجنتين', 'Brazil': 'البرازيل', 'Japan': 'اليابان', 'Australia': 'أستراليا',
    'Iraq': 'العراق', 'Jordan': 'الأردن', 'Qatar': 'قطر', 'United Arab Emirates': 'الإمارات', 'Kuwait': 'الكويت', 'Bahrain': 'البحرين',
    'Oman': 'عُمان', 'Yemen': 'اليمن', 'Egypt': 'مصر', 'Morocco': 'المغرب', 'Algeria': 'الجزائر', 'Tunisia': 'تونس', 'Iran': 'إيران',
    'South Korea': 'كوريا الجنوبية', 'China': 'الصين', 'Indonesia': 'إندونيسيا', 'Palestine': 'فلسطين', 'Syria': 'سوريا', 'Lebanon': 'لبنان',
    'Mexico': 'المكسيك', 'USA': 'أمريكا', 'France': 'فرنسا', 'Germany': 'ألمانيا', 'England': 'إنجلترا', 'Portugal': 'البرتغال' };
  function ar(n) { return AR[n] || n; }
  function evDate(e) { return e.strTimestamp ? new Date(e.strTimestamp.replace(/\+.*$/, '') + 'Z') : new Date(e.dateEvent + 'T' + (e.strTime || '00:00:00') + 'Z'); }
  function renderMatches(m) {
    var card = $('matchCard');
    var recentLast = m && m.last && m.last.intHomeScore !== null && m.last.intHomeScore !== undefined && (Date.now() - evDate(m.last)) < 4 * 864e5;
    if (!m || (!m.next && !recentLast)) { card.style.display = 'none'; return; }
    card.style.display = 'block';
    if (m.next) {
      var d = evDate(m.next), h = d.getHours(), ap = h < 12 ? 'ص' : 'م'; h = h % 12; if (h === 0) h = 12;
      var days = Math.round((new Date(d.toDateString()) - new Date(new Date().toDateString())) / 864e5);
      var when = days === 0 ? 'اليوم' : days === 1 ? 'غدًا' : DAYS[d.getDay()] + ' ' + d.getDate() + '/' + (d.getMonth() + 1);
      $('matchLbl').textContent = 'المباراة القادمة' + (m.next.strLeague ? ' · ' + (m.next.strLeague === 'Saudi-Arabian Pro League' ? 'دوري روشن' : m.next.strLeague) : '');
      $('matchTeams').innerHTML = ar(m.next.strHomeTeam) + '<span class="vs">×</span>' + ar(m.next.strAwayTeam);
      $('matchWhen').innerHTML = when + ' · <span class="num">' + h + ':' + pad(d.getMinutes()) + '</span> ' + ap;
    }
    if (!m.next) { $('matchLbl').textContent = 'آخر مباراة'; $('matchTeams').innerHTML = ''; $('matchWhen').innerHTML = ''; }
    if (recentLast) {
      $('matchLast').innerHTML = 'آخر نتيجة: ' + ar(m.last.strHomeTeam) + ' <span class="num">' + m.last.intHomeScore + ' - ' + m.last.intAwayScore + '</span> ' + ar(m.last.strAwayTeam);
    } else { $('matchLast').innerHTML = ''; }
  }
  function matches() {
    var cached = load('matches', 3 * HOUR);
    if (cached) { renderMatches(cached); return; }
    renderMatches(load('matches'));
    var res = { next: null, last: null }, i = 0;
    function step() {
      if (i >= CFG.teams.length) { store('matches', res); renderMatches(res); return; }
      var id = CFG.teams[i++], base = 'https://www.thesportsdb.com/api/v1/json/123/';
      getJSON(base + 'eventsnext.php?id=' + id).then(function (j) {
        var ev = (j.events || []).filter(function (e) { return evDate(e) > Date.now() - 2 * HOUR; })[0];
        if (ev && (!res.next || evDate(ev) < evDate(res.next))) res.next = ev;
        return new Promise(function (r) { setTimeout(r, 1500); });   // stay well under the free rate limit
      }).then(function () { return getJSON(base + 'eventslast.php?id=' + id); }).then(function (j) {
        var ev = (j.results || j.events || [])[0];
        if (ev && (!res.last || evDate(ev) > evDate(res.last))) res.last = ev;
      }).catch(function () {}).then(function () { setTimeout(step, 1500); });
    }
    step();
  }

  // ---------- Start ----------
  tick(); setInterval(tick, 1000);
  showPhoto(); setInterval(showPhoto, 5 * 6e4);          // checks every 5 min; changes on each 30-min slot
  weather(); setInterval(weather, 30 * 6e4);
  loadVerse(); loadHadith(); setInterval(function () { loadVerse(); loadHadith(); }, HOUR);
  setTimeout(rotateWisdom, 2500); setInterval(rotateWisdom, 60000);
  matches(); setInterval(matches, 30 * 6e4);
})();
</script>
</body>
</html>
